<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./reset.css">
</head>
<body>
    <header>
        <h1>Library of Books</h1>
        <div class="add-button-container">
            <button class="add-book-button" aria-label="Add a new book"><i class="fa-solid fa-plus"></i></button>
        </div>
        
    </header>

    <main>
        <div class="container">
            <div class="book-shelf">

            </div>
        </div>
        <dialog id="new-book-dialog">
            <div class="dialog-container">

                <form id="new-book-form">
                    <h2 class="form-title">New Book</h2>
                    <div class="title-container">
                        <label for="title-input">Title:</label>
                        <input type="text" name="title-input" id="title-input" required maxlength="25"/>
                    </div>
                    <div class="author-container">
                        <label for="author-input">Author:</label>
                        <input type="text" name="author-input" id="author-input" required maxlength="25"/>
                    </div>
                    <div class="pages-container">
                        <label for="pages-input">Page Count:</label>
                        <input type="number" name="pages-input" id="pages-input" max="99999" required />
                    </div>
                    <div class="cover-container">
                        <label for="cover-input">Cover Image (URL):</label>
                        <input type="url" name="cover-input" id="cover-input" placeholder="https://..."/>
                    </div>
                    <div class="isRead-container">
                        <label for="read-input">Has been read:</label>
                        <input type="checkbox" name="read-input" id="read-input" />
                    </div>
                    <div class="rating-input-container">
                        <input type="radio" name="rating" id="star-1" class="rating-radio" value="1">
                        <label for="star-1"><i class="fa-solid fa-star"></i></label>
                        
                        <input type="radio" name="rating" id="star-2" class="rating-radio" value="2">
                        <label for="star-2"><i class="fa-solid fa-star"></i></label>
                        
                        <input type="radio" name="rating" id="star-3" class="rating-radio" value="3">
                        <label for="star-3"><i class="fa-solid fa-star"></i></label>
                        
                        <input type="radio" name="rating" id="star-4" class="rating-radio" value="4">
                        <label for="star-4"><i class="fa-solid fa-star"></i></label>
                        
                        <input type="radio" name="rating" id="star-5" class="rating-radio" value="5">
                        <label for="star-5"><i class="fa-solid fa-star"></i></label>
                    </div>
                    <button class="submit-book-button">Submit book</button>
                </form>
                <button class="close-dialog-button">X</button>
            </div>
        </dialog>
    </main>
    <script src="./script.js"></script>
</body>
</html>
