<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./reset.css">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <button class="open-dialog-button">New Book</button>

            <dialog id="book-dialog">
                <form id="book-form">
                    <p>Enter a book:</p>
                    <div class="title-div">
                        <label for="title-input">Title:</label>
                        <input type="text" name="title-input" id="title-input" required/>
                    </div>
                    <div class="author-div">
                        <label for="author-input">Author:</label>
                        <input type="text" name="author-input" id="author-input" required />
                    </div>
                    <div class="pages-div">
                        <label for="pages-input">Page Count:</label>
                        <input type="number" name="pages-input" id="pages-input" required />
                    </div>
                    <div class="read-div">
                        <label for="read-input">Has been read:</label>
                        <input type="checkbox" name="read-input" id="read-input" />
                    </div>
                    <button class="submit-book-button">Submit book</button>
                </form>
                <button class="close-dialog-button">Close</button>
            </dialog>
        </div>
        <div class="library-section"></div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
